name: Call Configuration Workflow

on:
  push:

jobs:
  call_workflow:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh api \
            --method POST \
            /repos/SkillsFundingAgency/das-platform-building-blocks/dispatches \
            -f event_type=repository_created \
            -F "client_payload[message]=\"Hello, World!\"" \
            -F "client_payload[repository]=\"$GITHUB_REPOSITORY\""
        env:
          GH_TOKEN: ${{ github.token }}
