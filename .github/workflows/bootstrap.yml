name: Configure Repository Settings

on:
  push:
    branches:
      - 'main'
    paths:
      - 'as-manifest.yml'

jobs:
  configure_repository_settings:
    if: github.run_number == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2.2.1
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
      - name: Configure Repository Settings
        run: |
          gh api -X PUT 'orgs/SkillsFundingAgency/teams/das-platform-engineering/repos/$GITHUB_REPOSITORY' -f 'permission=admin'
          gh api -X PUT 'orgs/SkillsFundingAgency/teams/das-contributor/repos/$GITHUB_REPOSITORY' -f 'permission=push'
          gh api -X PUT 'orgs/SkillsFundingAgency/teams/das-security-alerts/repos/$GITHUB_REPOSITORY' -f 'permission=push'
          FIRST_COMMIT=$(gh api repos/$GITHUB_REPOSITORY/commits --paginate --jq '.[-1].sha')
          CREATOR=$(gh api repos/$GITHUB_REPOSITORY/commits/$FIRST_COMMIT --jq '.author.login')
          gh api -x DELETE repos/$GITHUB_REPOSITORY/collaborators/$CREATOR
          gh api -X PUT /repos/$GITHUB_REPOSITORY/branches/main/protection \
            --input - <<< '{
            "required_status_checks": {
              "strict": true,
              "contexts": []
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": true,
              "required_approving_review_count": 1,
              "require_last_push_approval": true
            },
            "restrictions": null
          }'
          gh api -X PATCH 'repos/$GITHUB_REPOSITORY/properties/values' \
            --input - <<< '{
            "properties": [
              {
                "property_name": "portfolio",
                "value": "Skills Group"
              },
              {
                "property_name": "service_line",
                "value": "Work Based Skills Directorate Admin - Apprenticeships"
              }
            ]
          }'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  configure_custom_properties:
    if: github.run_number > 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2.2.1
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
      - name: Configure "product" Custom Property
        run: |
          product=$(yq '.["Product name"]' as-manifest.yml)
          gh api -X PATCH 'repos/$GITHUB_REPOSITORY/properties/values' \
            --input - <<< '{
            "properties": [
              {
                "property_name": "product",
                "value": "$product"
              }
            ]
          }'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
